services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: compose
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://repopilot:repopilot@postgres:5432/repopilot
      REDIS_URL: redis://redis:6379/0
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-local-development-secret}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: python -m apps.worker.worker.main
    environment:
      APP_ENV: compose
      DATABASE_URL: postgresql+psycopg://repopilot:repopilot@postgres:5432/repopilot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repopilot
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: repopilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot -d repopilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
