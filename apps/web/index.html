<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepoPilot Operations</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">REPOPILOT / OPERATIONS</p>
          <h1>Engineering run control</h1>
        </div>
        <button id="refresh">Refresh</button>
      </header>
      <section class="metrics" id="metrics"></section>
      <section class="grid">
        <article class="panel">
          <div class="panel-heading"><h2>Runs</h2><span id="run-count"></span></div>
          <div id="runs" class="run-list"><p class="muted">Loading…</p></div>
        </article>
        <article class="panel">
          <div class="panel-heading"><h2>Run timeline</h2><span id="selected-run" class="muted">Select a run</span></div>
          <div id="events" class="timeline"><p class="muted">Choose a run to inspect its evidence.</p></div>
        </article>
      </section>
      <p id="error" class="error" role="alert"></p>
    </main>
    <script src="./app.js" type="module"></script>
  </body>
</html>
